<!doctype html>
<html lang="en" class="js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gold goat: pose sheet (kit demo)</title>
    <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@400;900&family=Martian+Mono:wdth,wght@75..112.5,100..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="kit.css" />
    <style>
      body { padding: 20px 24px 40px; }
      .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 34px 18px; align-items: end; }
      .tile { display: grid; justify-items: center; gap: 6px; font-size: 12px; }
      .tile .ground { width: 100%; }
      .row { display: flex; gap: 18px; align-items: end; margin-top: 30px; flex-wrap: wrap; }
      .row .goat-actor { width: 72px; }
      .cream { background: var(--paper); padding: 16px; margin-top: 24px; display: flex; gap: 20px; align-items: end; }
      .cream .goat-actor { width: 120px; }
    </style>
  </head>
  <body>
    <div id="defs"></div>
    <div class="grid" id="grid"></div>
    <div class="row" id="row"></div>
    <div class="cream" id="cream"></div>
    <script type="module">
      // the rig lives in index.html; borrow it so this sheet can never drift from the page
      const doc = new DOMParser().parseFromString(await (await fetch('index.html')).text(), 'text/html');
      document.getElementById('defs').append(document.importNode(doc.querySelector('svg.defs'), true));
      const poses = ['stand', 'walk-a', 'walk-b', 'graze', 'crouch', 'air', 'sit', 'talk', 'ears-up', 'look-back', 'nudge', 'peek', 'wag'];
      const actor = (p, flip) => `<svg class="goat-actor${flip ? ' flip' : ''}" data-pose="${p}" viewBox="0 0 760 630" aria-hidden="true"><use href="#goat-rig"/></svg>`;
      document.getElementById('grid').innerHTML = poses.map((p) => `<div class="tile"><div style="width:100%"><div style="width:86%">${actor(p).replace('class="goat-actor"', 'class="goat-actor" style="width:100%"')}</div><div class="ground"></div></div>${p}</div>`).join('');
      document.getElementById('row').innerHTML = poses.map((p) => actor(p)).join('') + actor('stand', true);
      document.getElementById('cream').innerHTML = actor('stand') + actor('sit') + actor('look-back', true);
      document.documentElement.dataset.ready = '1';
    </script>
  </body>
</html>
