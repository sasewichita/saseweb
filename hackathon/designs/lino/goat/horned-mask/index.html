<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>Hack the Wu · Year of the Goat</title>

      name="description"
      content="Hack the Wu is SASE at Wichita State's second annual hackathon: beginner friendly and open to every undergrad and grad student, in every major."
    />

    <link rel="icon" type="image/png" href="../../../../assets/favicon-32.png" />
    <link rel="apple-touch-icon" href="../../../../assets/apple-touch-icon.png" />

    <link

      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&text=%E7%BE%8A&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../kit/lino.css" />
    <link rel="stylesheet" href="hero.css" />
  </head>
  <body>
    <a class="skip" href="#after">Skip to content</a>

    <canvas class="eye" id="eye" aria-hidden="true"></canvas>

    <!--
      THE GOAT: one block print of a goat's head in profile, facing right, placed twice.
      Units: 1000 = the short side of the screen, (0, 0) = the centre of the screen, y down.
      The pieces in <defs> are drawn with the centre of the live eye at (0, 0) and the eye at scale
      0.40 (opening 528 wide, 117 up, 100 down). Each placement's <g transform="translate(x y) scale(k)">
      must match hero.js: x = EYE.center[0] * 1000, y = -EYE.center[1] * 1000, k = EYE.scale / 0.40.
      Paint order per piece: red block a little off register, ink block, then the cuts (bone paper)
      the gouge took out of the ink. The .p groups are the pieces that come apart on scroll; a pose
      goes on an inner <g>, because the scroll step sets a CSS transform on .p.
    -->
    <div class="masks" aria-hidden="true">
      <svg class="defs" width="0" height="0" focusable="false">
        <defs>
          <!-- ink with salt: specks of paper through solid ink -->
          <pattern id="ink" width="190" height="190" patternUnits="userSpaceOnUse">
            <rect width="190" height="190" fill="#121110" />
            <path fill="#EBE3CF" d="M0 175h2v1h-2zM139 101h2v2h-2zM143 103h2v2h-2zM155 46h2v2h-2zM133 10h2v2h-2zM175 153h1v2h-1zM175 131h2v2h-2zM173 173h2v1h-2zM159 63h1v1h-1zM81 56h3v2h-3zM139 167h1v1h-1zM107 97h2v1h-2zM173 10h2v1h-2zM126 176h2v1h-2zM77 54h2v2h-2zM63 101h2v1h-2zM172 87h3v2h-3zM121 98h2v2h-2zM179 75h2v1h-2zM112 67h2v2h-2zM151 167h1v2h-1zM15 77h1v1h-1zM189 42h2v1h-2zM87 113h1v2h-1zM168 169h3v2h-3zM145 52h1v1h-1zM14 0h2v1h-2zM141 93h2v1h-2zM168 45h2v2h-2zM22 93h1v2h-1zM121 175h1v2h-1zM36 184h2v2h-2zM51 42h1v2h-1zM10 146h2v2h-2zM95 6h1v2h-1zM25 131h3v1h-3zM168 164h3v2h-3zM145 80h1v2h-1zM168 76h1v2h-1zM169 106h2v2h-2zM140 64h2v2h-2zM38 59h3v2h-3zM120 166h3v1h-3zM123 26h2v2h-2zM147 180h2v1h-2zM85 32h2v2h-2z" />
          </pattern>
          <!-- hand-cut edges: every edge of the print wanders a few units -->
          <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
            <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="n" />
            <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G" />
          </filter>

          <!-- head and neck: long face, blunt muzzle, shaggy neck -->
          <path id="head" d="M120 -205C230 -185 330 -135 420 -70C520 0 640 85 730 150C770 178 800 215 806 258C812 300 800 330 776 342L744 346C756 358 754 376 734 386C712 398 680 404 650 402C560 395 430 372 320 334C240 306 170 292 110 300C70 340 55 420 50 500L20 560L-20 505L-60 575L-100 510L-145 580L-185 512L-225 570L-255 500C-262 380 -262 260 -275 170C-292 80 -318 0 -305 -90C-290 -160 -230 -205 -150 -215Z" />
          <!-- cuts in the head: nose bridge, muzzle, cheek, neck hair, mouth, nostril -->
          <path id="head-cuts" d="
            M310 -90Q499 26 690 140Q511 7 310 -90Z
            M690 160Q663 249 700 335Q683 248 690 160Z
            M160 255Q351 344 560 375Q358 321 160 255Z
            M260 170Q432 251 620 285Q439 230 260 170Z
            M360 75Q498 151 650 190Q505 133 360 75Z
            M-215 240Q-227 391 -200 540Q-200 390 -215 240Z
            M-135 310Q-156 432 -140 555Q-131 433 -135 310Z
            M-55 360Q-72 440 -60 520Q-51 440 -55 360Z
            M746 346Q701 344 655 346Q701 364 746 346Z
            M786 226C770 214 746 220 738 238C752 234 770 238 786 252Z" />
          <!-- cuts round the eye: the brow fold and the fold under the eye. They follow the eye, not the pose -->
          <path id="eye-folds" d="M-288 -8C-200 -235 190 -240 292 -4C185 -205 -195 -205 -288 -8ZM-205 118C-90 165 80 158 205 96C80 140 -90 146 -205 118Z" />
          <!-- horn: thick at the root, sweeping back, ringed -->
          <path id="horn" d="M-150 -195C-155 -250 -200 -280 -270 -292C-380 -305 -500 -280 -590 -200C-515 -310 -415 -385 -280 -398C-120 -412 30 -385 85 -320C112 -288 118 -245 110 -205Z" />
          <path id="horn-cuts" d="
            M-155 -234Q-25 -247 104 -260Q-28 -275 -155 -234Z
            M-196 -268Q-66 -301 64 -332Q-73 -330 -196 -268Z
            M-262 -290Q-148 -334 -34 -376Q-159 -362 -262 -290Z
            M-347 -292Q-256 -341 -166 -390Q-270 -366 -347 -292Z
            M-430 -280Q-360 -332 -292 -386Q-376 -353 -430 -280Z
            M-508 -250Q-454 -302 -402 -356Q-471 -319 -508 -250Z
            M-556 -224Q-521 -261 -490 -300Q-535 -272 -556 -224Z" />
          <!-- ear: a leaf held out sideways, red inside -->
          <path id="ear" d="M-285 -140C-380 -190 -520 -170 -640 -70C-530 -10 -410 0 -292 -48Z" />
          <path id="ear-inner" d="M-305 -118C-390 -155 -505 -138 -600 -72C-510 -38 -405 -28 -305 -66Z" />
          <path id="ear-cut" d="M-310 -152Q-455 -117 -600 -82Q-451 -101 -310 -152Z" />
          <!-- beard: hangs from under the chin; its top hides under the jaw, so it prints before the head -->
          <path id="beard" d="M572 350C594 440 618 510 648 585C668 520 694 448 718 360Z" />
          <path id="beard-cuts" d="
            M610 410Q612 488 640 560Q632 484 610 410Z
            M650 415Q639 478 650 540Q657 478 650 415Z
            M690 410Q670 464 662 520Q686 467 690 410Z" />

          <!-- the eye opening of kit/eye.js at scale 0.40 -->
          <path id="almond" d="M-264 0L-242 -30L-220 -46.9L-198 -60.2L-176 -71.5L-154 -81.1L-132 -89.5L-110 -96.7L-88 -102.8L-66 -107.9L-44 -111.9L-22 -114.9L0 -116.8L22 -117.6L44 -117.1L66 -115.4L88 -112.3L110 -107.7L132 -101.5L154 -93.5L176 -83.3L198 -70.7L220 -55L242 -34.7L264 0L242 19.4L220 33.8L198 46.2L176 57.1L154 66.5L132 74.8L110 81.8L88 87.8L66 92.5L44 96.2L22 98.7L0 100L-22 100.1L-44 99L-66 96.7L-88 93L-110 87.9L-132 81.4L-154 73.3L-176 63.6L-198 52L-220 38.3L-242 21.9Z" />
          <clipPath id="eyeclip"><use href="#almond" /></clipPath>
          <!-- the eye as a still print, for when there is no live eye -->
          <g id="still-eye">
            <use href="#almond" fill="#EBE3CF" />
            <g clip-path="url(#eyeclip)">
              <circle r="172" fill="#121110" />
              <circle r="138" fill="#F0B90A" />
              <rect x="-143" y="-42" width="286" height="84" rx="6" fill="#EBE3CF" />
              <rect x="-132" y="-31" width="264" height="62" rx="3" fill="#121110" />
              <path fill="#EBE3CF" d="M-122 -92l16 -8 34 46 -16 8zM-88 -82l12 -6 20 28 -12 6z" />
            </g>
            <use href="#almond" fill="none" stroke="#121110" stroke-width="18" />
          </g>
        </defs>
      </svg>

      <!-- DESKTOP: the head held level across the screen, horn sweeping back over the top left -->
      <svg class="art art-d" viewBox="-800 -500 1600 1000" focusable="false">
        <g transform="translate(-190 -75) scale(0.95)">
          <g class="print" filter="url(#rough)">
            <g class="p p-horn">
              <use href="#horn" fill="#E0301E" transform="translate(55 -30)" />
            </g>
            <g class="p p-beard">
              <use href="#beard" fill="#E0301E" transform="translate(7 5)" />
              <use href="#beard" fill="url(#ink)" />
              <use href="#beard-cuts" fill="#EBE3CF" />
            </g>
            <g class="p p-head">
              <use href="#head" fill="#E0301E" transform="translate(7 5)" />
              <use href="#head" fill="url(#ink)" />
              <use href="#head-cuts" fill="#EBE3CF" />
              <use href="#eye-folds" fill="#EBE3CF" />
            </g>
            <g class="p p-ear">
              <g transform="rotate(-12 -290 -95)">
                <use href="#ear" fill="#E0301E" transform="translate(7 5)" />
                <use href="#ear" fill="url(#ink)" />
                <use href="#ear-inner" fill="#E0301E" />
                <use href="#ear-cut" fill="#EBE3CF" />
              </g>
            </g>
            <g class="p p-horn">
              <use href="#horn" fill="#E0301E" transform="translate(7 5)" />
              <use href="#horn" fill="url(#ink)" />
              <use href="#horn-cuts" fill="#EBE3CF" />
            </g>
          </g>
          <use class="fake" href="#still-eye" />
        </g>
      </svg>

      <!-- PHONE: the same goat with its head lowered down the long screen, horn a little smaller, ear drooping -->
      <svg class="art art-p" viewBox="-500 -1100 1000 2200" focusable="false">
        <g transform="translate(-40 -304) scale(0.9)">
          <g class="print" filter="url(#rough)">
            <g class="p p-horn">
              <g transform="rotate(21) translate(-2 -16) scale(0.92)">
                <use href="#horn" fill="#E0301E" transform="translate(55 -30)" />
              </g>
            </g>
            <g class="p p-beard">
              <g transform="rotate(32)">
                <use href="#beard" fill="#E0301E" transform="translate(7 5)" />
                <use href="#beard" fill="url(#ink)" />
                <use href="#beard-cuts" fill="#EBE3CF" />
              </g>
            </g>
            <g class="p p-head">
              <g transform="rotate(32)">
                <use href="#head" fill="#E0301E" transform="translate(7 5)" />
                <use href="#head" fill="url(#ink)" />
                <use href="#head-cuts" fill="#EBE3CF" />
              </g>
              <use href="#eye-folds" fill="#EBE3CF" />
            </g>
            <g class="p p-ear">
              <g transform="rotate(32) rotate(-44 -290 -95) translate(-43.5 -14.25) scale(0.85)">
                <use href="#ear" fill="#E0301E" transform="translate(7 5)" />
                <use href="#ear" fill="url(#ink)" />
                <use href="#ear-inner" fill="#E0301E" />
                <use href="#ear-cut" fill="#EBE3CF" />
              </g>
            </g>
            <g class="p p-horn">
              <g transform="rotate(21) translate(-2 -16) scale(0.92)">
                <use href="#horn" fill="#E0301E" transform="translate(7 5)" />
                <use href="#horn" fill="url(#ink)" />
                <use href="#horn-cuts" fill="#EBE3CF" />
              </g>
            </g>
          </g>
          <use class="fake" href="#still-eye" />
        </g>
      </svg>
    </div>

    <header class="hero" id="top">
      <div class="slot">
        <h1>Hack the Wu <small>Year of the Goat</small></h1>
      </div>
      <p class="caption caption--edition"><b>SASE at Wichita State</b><br />2nd annual hackathon</p>
      <p class="caption caption--when"><b>March 26–28, 2027</b><br />Wichita State University</p>
      <p class="caption caption--pitch">
        A beginner-friendly hackathon at Wichita State, open to every undergrad and grad student in every major.
      </p>
      <p class="hero-actions">
        <a class="btn btn--block" href="../../a-newyear/register.html">Register</a>
        <a class="btn btn--ink" href="https://discord.gg/VwQhFkzWNH">Get updates on Discord</a>
      </p>
      <span class="seal chop" lang="zh-Hant" aria-hidden="true">羊</span>
    </header>

    <div class="after" id="after"></div>
    <script type="module" src="hero.js"></script>
  </body>
</html>
