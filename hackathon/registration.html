<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register · Hack the Wu</title>
  <meta name="description" content="Register for Hack the Wu, SASE at Wichita State's second annual hackathon." />
  <meta name="theme-color" content="#10030a" />
  <link rel="icon" type="image/png" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=DM+Mono:wght@400;500&family=Dela+Gothic+One&display=swap" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    /* The form sits on a sheet of cream paper, set on a second sheet like the page's buttons. */
    .register { padding: calc(var(--nav) + clamp(40px, 8vh, 88px)) 0 clamp(64px, 10vh, 112px); }
    .register-head { display: flex; justify-content: space-between; align-items: end; gap: 16px var(--gutter); flex-wrap: wrap; margin-bottom: clamp(28px, 5vh, 48px); }
    .register-head h2 { margin: 0; }
    .register-head p { margin: 0; color: var(--muted); }
    .sheet { max-width: 760px; margin: 0 auto; padding: 8px; background: var(--cream); border: 2px solid var(--ink); border-radius: 6px; box-shadow: 8px 8px 0 var(--verm); }
    .sheet iframe { display: block; width: 100%; height: 2300px; border: 0; }
    @media (max-width: 640px) { .sheet { padding: 0; box-shadow: 5px 5px 0 var(--verm); } .sheet iframe { height: 2700px; } }
  </style>
</head>
<body>
  <div class="world" aria-hidden="true"></div>

  <header class="top">
    <div class="container top-inner">
      <a class="brand" href="/">Hack the Wu</a>
      <nav class="top-nav" aria-label="Site">
        <a href="/#about">About</a>
        <a href="/#details">Details</a>
        <a href="/#sponsors">Sponsors</a>
        <a href="/#faq">FAQ</a>
        <a class="btn btn-sm" href="https://discord.gg/VwQhFkzWNH">Get updates</a>
      </nav>
    </div>
  </header>

  <main class="register">
    <div class="container">
      <div class="register-head">
        <h2>Register for Hack the Wu</h2>
        <p>Form not loading? <a href="https://forms.gle/qAMZntEdfiqmrigi6">Open it in Google Forms</a>.</p>
      </div>
      <div class="sheet">
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSffy8mhqrA2Oxq3w4JKTRhSxCev-UeuY9FiUWDqyIg_0r3Bjw/viewform?embedded=true" title="Hack the Wu registration form" loading="lazy">Loading…</iframe>
      </div>
    </div>
  </main>

  <footer class="foot">
    <div class="foot-bar">
      <div class="container foot-inner">
        <div class="foot-brand">
          <img src="/assets/sase-mark-dark.svg" alt="" width="28" height="38" />
          <span>Hosted by <a href="https://sasewichita.org">SASE at Wichita State</a></span>
        </div>
        <a class="muted" href="mailto:wichita@saseconnect.org">wichita@saseconnect.org</a>
      </div>
    </div>
  </footer>

  <script>
    const top_ = document.querySelector(".top");
    const set = () => top_.classList.toggle("is-solid", scrollY > 24);
    addEventListener("scroll", set, { passive: true });
    set();
  </script>
</body>
</html>
